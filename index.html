<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ATTCLIMPOLS · Ola 5 · Simulador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2a2e;
    --paper:#eef2ef;
    --paper2:#e2e9e4;
    --line:#c7d1c9;
    --accent:#2f6f62;
    --accent-dark:#1f4a41;
    --amber:#b5772f;
    --white:#fbfcfa;
    --danger:#a4432f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:10;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .progress-track{height:3px; background:var(--paper2);}
  .progress-fill{height:3px; background:var(--accent); transition:width .25s ease;}
  .topbar-inner{
    max-width:720px; margin:0 auto; padding:10px 20px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:#5a6a63;
  }
  .topbar-block{ text-transform:uppercase; letter-spacing:.08em; font-weight:500; color:var(--accent-dark);}
  .wrap{max-width:720px; margin:0 auto; padding:40px 20px 120px;}
  .card{
    background:var(--white); border:1px solid var(--line); border-radius:2px;
    padding:32px 30px; box-shadow:0 1px 0 var(--line);
  }
  .qcode{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--amber);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;
  }
  .qtitle{
    font-family:'Newsreader',serif; font-size:26px; font-weight:500; line-height:1.25;
    margin:0 0 6px;
  }
  .qsubtitle{
    font-size:14px; color:#4a5a53; margin:0 0 22px; line-height:1.55;
  }
  .qintro{font-family:'Newsreader',serif; font-style:italic; font-size:17px; line-height:1.6; color:#26362f; margin:0 0 18px;}
  .scenario{
    background:var(--paper2); border-left:3px solid var(--accent); padding:16px 18px;
    font-size:14.5px; line-height:1.6; margin-bottom:20px; white-space:pre-line;
  }
  .var-tag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:#7a8a82; background:var(--paper2); padding:2px 6px; border-radius:2px; margin-bottom:16px;
  }
  .options{display:flex; flex-direction:column; gap:8px; margin-bottom:24px;}
  .opt{
    text-align:left; padding:13px 16px; border:1px solid var(--line); background:var(--white);
    border-radius:2px; cursor:pointer; font-size:15px; color:var(--ink);
    transition:border-color .15s, background .15s; font-family:'Inter',sans-serif;
  }
  .opt:hover{border-color:var(--accent);}
  .opt.selected{border-color:var(--accent); background:#eaf3ef; font-weight:600;}
  .scale-row{display:flex; gap:4px; margin-bottom:6px; flex-wrap:wrap;}
  .scale-btn{
    flex:1; min-width:30px; padding:10px 0; text-align:center; border:1px solid var(--line);
    background:var(--white); cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:13px;
    border-radius:2px;
  }
  .scale-btn.selected{background:var(--accent); color:var(--white); border-color:var(--accent); font-weight:600;}
  .scale-labels{display:flex; justify-content:space-between; font-size:11.5px; color:#5a6a63; margin-bottom:22px;}
  .grid-item{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--paper2);}
  .grid-item:last-child{border-bottom:none;}
  .grid-item-label{font-size:14.5px; margin-bottom:8px; line-height:1.4;}
  .binary-row{display:flex; gap:8px;}
  .binary-btn{flex:1; padding:9px 0; text-align:center; border:1px solid var(--line); background:var(--white); cursor:pointer; border-radius:2px; font-size:13.5px;}
  .binary-btn.selected{background:var(--accent); color:var(--white); border-color:var(--accent); font-weight:600;}
  .rank-list{display:flex; flex-direction:column; gap:8px; margin-bottom:24px;}
  .rank-item{
    display:flex; align-items:center; gap:12px; padding:12px 16px; border:1px solid var(--line);
    background:var(--white); cursor:pointer; border-radius:2px; font-size:14.5px;
  }
  .rank-item.ranked{border-color:var(--accent); background:#eaf3ef;}
  .rank-badge{
    width:24px; height:24px; border-radius:50%; background:var(--paper2); color:#5a6a63;
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace;
    font-size:12px; flex-shrink:0;
  }
  .rank-item.ranked .rank-badge{background:var(--accent); color:var(--white);}
  .hint{font-size:12.5px; color:#7a8a82; margin-bottom:16px;}
  input[type=number], input[type=text]{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:2px;
    font-size:15px; font-family:'Inter',sans-serif; margin-bottom:22px; background:var(--white);
  }
  .conjoint-table{width:100%; border-collapse:collapse; margin-bottom:22px; font-size:13.5px;}
  .conjoint-table th{
    background:var(--accent-dark); color:var(--white); font-weight:600; padding:10px 12px;
    text-align:left; font-size:13px;
  }
  .conjoint-table td{border-bottom:1px solid var(--paper2); padding:11px 12px; vertical-align:top; line-height:1.4;}
  .conjoint-table td.attr-label{font-weight:600; color:#4a5a53; width:26%;}
  .mini-scale{display:flex; gap:2px; margin-top:6px;}
  .mini-btn{
    flex:1; padding:6px 0; text-align:center; border:1px solid var(--line); background:var(--white);
    cursor:pointer; font-family:'IBM Plex Mono',monospace; font-size:11px; border-radius:1px;
  }
  .mini-btn.selected{background:var(--accent); color:var(--white); border-color:var(--accent);}
  .rate-block{margin-top:8px;}
  .rate-label{font-size:13px; font-weight:600; margin-bottom:4px;}
  .btn-row{display:flex; justify-content:flex-end; gap:10px; margin-top:8px;}
  .btn{
    padding:12px 26px; border-radius:2px; border:none; font-size:14.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--accent); color:var(--white);}
  .btn-primary:disabled{background:#b7c4bd; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:#5a6a63; border:1px solid var(--line);}
  .start-screen{text-align:center; padding:60px 20px;}
  .start-screen h1{font-family:'Newsreader',serif; font-size:34px; font-weight:500; margin-bottom:14px;}
  .start-screen p{font-size:15px; color:#4a5a53; max-width:520px; margin:0 auto 10px; line-height:1.6;}
  .meta-list{
    text-align:left; max-width:480px; margin:26px auto; font-size:13.5px; color:#4a5a53;
    background:var(--white); border:1px solid var(--line); padding:18px 22px; border-radius:2px; line-height:1.9;
  }
  .meta-list b{color:var(--ink);}
  .end-screen h1{font-family:'Newsreader',serif; font-size:30px; font-weight:500; margin-bottom:8px;}
  .stat-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--paper2); font-size:14px;}
  .stat-row b{font-family:'IBM Plex Mono',monospace; color:var(--accent-dark);}
  table.timing{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:18px;}
  table.timing th{text-align:left; padding:6px 8px; border-bottom:2px solid var(--line); color:#5a6a63; font-weight:600;}
  table.timing td{padding:6px 8px; border-bottom:1px solid var(--paper2); font-family:'IBM Plex Mono',monospace;}
  .assign-tag{display:inline-block; background:var(--paper2); color:var(--accent-dark); font-family:'IBM Plex Mono',monospace; font-size:11px; padding:3px 8px; border-radius:2px; margin:2px 4px 2px 0;}
  .doc{font-size:14.5px; line-height:1.65; color:#26362f; margin-bottom:24px;}
  .doc h3{font-family:'Newsreader',serif; font-size:18px; font-weight:600; margin:22px 0 6px; color:var(--accent-dark);}
  .doc h3:first-child{margin-top:0;}
  .doc p{margin:0 0 12px;}
  .doc .cond{
    background:var(--paper2); border-left:3px solid var(--amber); padding:12px 16px; margin:0 0 12px;
  }
  .doc .cond-tag{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--amber); margin-bottom:6px;
  }
  .doc .note{
    font-size:12.5px; color:#7a8a82; border-top:1px solid var(--line); padding-top:12px; margin-top:18px;
  }
  .doc a{color:var(--accent-dark);}
</style>
</head>

<script>
/* ============ ENVIAMENT DE RESPOSTES (Google Sheets via Apps Script) ============ */
/* Un cop desplegat l'Apps Script (Code.gs) com a aplicació web, enganxa aquí
   la URL que acaba en /exec. Mentre estigui buida, el botó de guardar queda
   desactivat i el simulador funciona igual, sense enviar res enlloc. */
const APPS_SCRIPT_URL = '';

/* ============ UTIL ============ */
const $ = sel => document.querySelector(sel);
const el = (tag, attrs={}, ...children) => {
  const n = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') n.className = attrs[k];
    else if(k==='html') n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  children.forEach(c => n.appendChild(typeof c==='string' ? document.createTextNode(c) : c));
  return n;
};
const randInt = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const pick = arr => arr[randInt(0, arr.length-1)];
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=randInt(0,i); [a[i],a[j]]=[a[j],a[i]];} return a; };
const fmtTime = s => {
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
};
const mdToHtml = str => (str||'').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const lc1 = str => str.charAt(0).toLowerCase() + str.slice(1);

/* ============ STATE ============ */
const S = {
  answers: {},
  assign: {},
  timings: [],
  startTs: null,
  qStartTs: null,
  clockTimer: null
};

/* ============ CONJOINT DATA (Experiment C) ============ */
const CJ_DOMAINS = {
  transporte: { prefix:'En el ámbito del transporte', rows:[
    {text:'se aplicará un impuesto sobre las emisiones a las empresas petroleras y a los fabricantes de vehículos', levels:['30 € por tonelada de CO₂','60 € por tonelada de CO₂','120 € por tonelada de CO₂']},
    {text:'los fabricantes estarán obligados a que una parte mínima de sus ventas sean vehículos sin emisiones', levels:['el 30% de los vehículos nuevos en 2035','el 60% de los vehículos nuevos en 2035','el 100% de los vehículos nuevos en 2035']},
    {text:'se cobrará un impuesto por cada kilómetro recorrido en vehículos de combustión', levels:['3 céntimos por km (30 € cada 1.000 km)','6 céntimos por km (60 € cada 1.000 km)','9 céntimos por km (90 € cada 1.000 km)']},
    {text:'se restringirá la circulación de vehículos en las zonas urbanas', levels:['con zonas de bajas emisiones en ciudades de más de 50.000 habitantes','con un día a la semana sin circulación','con prohibición de vehículos de combustión en los centros urbanos']}
  ]},
  alimentacion: { prefix:'En el ámbito de la alimentación', rows:[
    {text:'se aplicará un impuesto sobre las emisiones a los productores de carne y lácteos', levels:['que encarecerá sus costes de producción un 5%','que encarecerá sus costes de producción un 15%','que encarecerá sus costes de producción un 30%']},
    {text:'se establecerá un límite legal al número de cabezas de ganado', levels:['con una reducción del 10% de la cabaña ganadera','con una reducción del 25% de la cabaña ganadera','con una reducción del 40% de la cabaña ganadera']},
    {text:'se aumentará el IVA de la carne, actualmente del 10%', levels:['hasta el 15%','hasta el 21%','hasta el 30%']},
    {text:'por ley, los bares y restaurantes no podrán servir carne algunos días de la semana', levels:['1 día a la semana','2 días a la semana','3 días a la semana']}
  ]},
  energia: { prefix:'En el ámbito de la energía doméstica', rows:[
    {text:'se aplicará un impuesto sobre las emisiones a las compañías energéticas', levels:['30 € por tonelada de CO₂','60 € por tonelada de CO₂','120 € por tonelada de CO₂']},
    {text:'las compañías energéticas estarán obligadas a que una parte mínima de la energía que suministran sea renovable', levels:['el 50% en 2035','el 75% en 2035','el 100% en 2035']},
    {text:'se aumentará el impuesto sobre el gas y los combustibles de calefacción', levels:['un 10%','un 25%','un 50%']},
    {text:'se obligará a sustituir los sistemas de calefacción que funcionan con combustibles fósiles', levels:['con prohibición de instalar calderas de gas nuevas a partir de 2030','con sustitución obligatoria de todas las calderas de gas en 2035','con obligación de reformar el aislamiento antes de vender o alquilar la vivienda']}
  ]}
};
function randomCjProfile(){
  const domKey = pick(Object.keys(CJ_DOMAINS));
  const dom = CJ_DOMAINS[domKey];
  const row = pick(dom.rows);
  const level = pick(row.levels);
  const text = `${dom.prefix}, ${row.text}, <b>${level}</b>.`;
  return { text };
}

/* ============ CONJOINT DATA (Experiment D) ============ */
const RULES_ATTRS = [
  {name:'Tamaño de Circunscripción', levels:['Circunscripciones pequeñas','Circunscripciones grandes']},
  {name:'Escaños Mínimos por Territorio', levels:['Sin mínimo garantizado por territorio','Mínimo garantizado por territorio']},
  {name:'Umbral Electoral', levels:['Umbral del 0%','Umbral del 5%']},
  {name:'Escaños Adicionales al Ganador', levels:['Sin escaños extra al más votado','Escaños extra al más votado']}
];
const CONS_ATTRS = [
  {name:'Proporcionalidad', levels:['Premio a los partidos grandes','Reparto proporcional a los votos']},
  {name:'Equilibrio Territorial', levels:['Más peso a las regiones pobladas','Compensación a las regiones menos pobladas']},
  {name:'Representación de Partidos Pequeños', levels:['Difícil entrada de partidos pequeños','Fácil entrada de partidos pequeños']},
  {name:'Capacidad para Formar Gobierno', levels:['Necesita pactar para gobernar','Puede gobernar en solitario']},
  {name:'Personalización de la Política', levels:['Disciplina de partido','Voto según criterio propio']}
];
function randomSystem(attrs){ return attrs.map(a => pick(a.levels)); }

/* ============ PARTY LIST ============ */
const PARTIES = [
  ['1','PP'],['2','PSOE'],['3','Sumar'],['4','Ciudadanos'],['5','Vox'],['6','Podemos'],
  ['7','ERC'],['8','Junts per Catalunya'],['9','CUP'],['10','EAJ-PNV'],['11','EH Bildu'],
  ['12','Coalición Canaria (CCa)'],['13','Nueva Canarias'],['14','UPN'],['15','BNG'],
  ['16','Compromís'],['17','PRC'],['18','España vaciada (Teruel Existe, Soria ¡Ya!...)'],
  ['19','Se acabó la fiesta'],['96','Otro partido (especifica)'],['97','Ningún partido'],
  ['98','No lo sé / Prefiero no contestar']
];

/* ============ NAVEGACIÓ ============ */
/* Botó "Enrere" disponible a totes les pantalles excepte la primera.
   Cap pregunta valida que hi hagi resposta: sempre es pot tirar endavant. */
function backBtn(){
  if(idx <= 0) return null;
  const b = el('button',{class:'btn btn-ghost'}, '← Enrere');
  b.onclick = () => goBack();
  return b;
}
function navRow(nextBtn, extra){
  const row = el('div',{class:'btn-row'});
  const bb = backBtn();
  if(bb) row.appendChild(bb);
  if(extra) row.appendChild(extra);
  row.appendChild(nextBtn);
  return row;
}

/* ============ QUESTION RENDERERS ============ */
function questionShell(qcode, varTag, title, subtitle){
  const card = el('div',{class:'card'});
  if(qcode) card.appendChild(el('div',{class:'qcode'}, qcode));
  if(title) card.appendChild(el('h2',{class:'qtitle'}, title));
  if(subtitle) card.appendChild(el('p',{class:'qsubtitle'}, subtitle));
  if(varTag) card.appendChild(el('div',{class:'var-tag'}, varTag));
  return card;
}

function renderInfo(q, onNext){
  const card = questionShell(q.code, null, q.title, null);
  if(q.scenario){
    const sc = el('div',{class:'scenario'});
    sc.innerHTML = mdToHtml(q.scenario);
    card.appendChild(sc);
  } else if(q.intro) card.appendChild(el('p',{class:'qintro'}, q.intro));
  const next = el('button',{class:'btn btn-primary'}, 'Continuar');
  next.onclick = () => onNext({});
  card.appendChild(navRow(next));
  return card;
}

/* Document llarg (consentiment, debrief): text amb encapçalaments. */
function renderDoc(q, onNext, prev){
  const card = el('div',{class:'card'});
  if(q.code) card.appendChild(el('div',{class:'qcode'}, q.code));
  if(q.title) card.appendChild(el('h2',{class:'qtitle'}, q.title));
  const body = el('div',{class:'doc'});
  body.innerHTML = q.html;
  card.appendChild(body);
  let selected = prev && prev.value != null ? prev.value : null;
  if(q.options){
    const opts = el('div',{class:'options'});
    q.options.forEach(([val,label]) => {
      const b = el('button',{class:'opt'}, label);
      if(selected === val) b.classList.add('selected');
      b.onclick = () => {
        [...opts.children].forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');
        selected = val;
      };
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }
  const next = el('button',{class:'btn btn-primary'}, q.nextLabel || 'Continuar');
  next.onclick = () => onNext({value: selected});
  card.appendChild(navRow(next));
  return card;
}

function renderSingle(q, onNext, prev){
  const card = questionShell(q.code, q.varTag, q.title, q.subtitle);
  if(q.scenario) card.insertBefore(el('div',{class:'scenario'}, q.scenario), card.children[card.children.length-0]);
  let selected = prev && prev.value != null ? prev.value : null;
  const opts = el('div',{class:'options'});
  q.options.forEach(([val,label]) => {
    const b = el('button',{class:'opt'}, label);
    if(selected === val) b.classList.add('selected');
    b.onclick = () => {
      [...opts.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
      selected = val;
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  const nextBtn = el('button',{class:'btn btn-primary'}, 'Següent');
  nextBtn.onclick = () => onNext({value: selected});
  card.appendChild(navRow(nextBtn));
  return card;
}

function buildScaleRow(min, max){
  const row = el('div',{class:'scale-row'});
  const count = max-min+1;
  if(count > 8){
    row.style.display = 'grid';
    row.style.gridTemplateColumns = 'repeat(6, 1fr)';
    row.style.rowGap = '6px';
  }
  return row;
}

function renderScale(q, onNext, prev){
  const card = questionShell(q.code, q.varTag, q.title, q.subtitle);
  const min = q.min ?? 0, max = q.max ?? 10;
  let selected = prev && prev.value != null ? prev.value : null;
  const row = buildScaleRow(min, max);
  for(let i=min;i<=max;i++){
    const b = el('button',{class:'scale-btn'}, String(i));
    if(selected === i) b.classList.add('selected');
    b.onclick = () => {
      [...row.children].forEach(c=>c.classList.remove('selected'));
      b.classList.add('selected');
      selected = i;
    };
    row.appendChild(b);
  }
  card.appendChild(row);
  if(q.minLabel || q.maxLabel){
    card.appendChild(el('div',{class:'scale-labels'},
      el('span',{}, `${min} = ${q.minLabel||''}`),
      el('span',{}, `${max} = ${q.maxLabel||''}`)));
  }
  const nextBtn = el('button',{class:'btn btn-primary'}, 'Següent');
  nextBtn.onclick = () => onNext({value: selected});
  card.appendChild(navRow(nextBtn));
  return card;
}

function renderNumber(q, onNext, prev){
  const card = questionShell(q.code, q.varTag, q.title, q.subtitle);
  const input = el('input',{type:'number', placeholder:q.placeholder||''});
  if(q.min!=null) input.min = q.min;
  if(q.max!=null) input.max = q.max;
  if(prev && prev.value != null) input.value = prev.value;
  card.appendChild(input);
  const nextBtn = el('button',{class:'btn btn-primary'}, 'Següent');
  nextBtn.onclick = () => onNext({value: input.value === '' ? null : input.value});
  card.appendChild(navRow(nextBtn));
  input.focus();
  return card;
}

function renderRank(q, onNext, prev){
  const card = questionShell(q.code, q.varTag, q.title, q.subtitle);
  card.appendChild(el('div',{class:'hint'}, `Haz clic en los ítems por orden, del más importante al menos importante (1–${q.items.length}).`));
  const list = el('div',{class:'rank-list'});
  const order = prev && prev.value ? {...prev.value} : {};
  let counter = Object.keys(order).length;
  q.items.forEach(([val,label]) => {
    const badge = el('span',{class:'rank-badge'}, order[val] ? String(order[val]) : '');
    const item = el('div',{class:'rank-item'}, badge, el('span',{}, label));
    if(order[val]) item.classList.add('ranked');
    item.onclick = () => {
      if(order[val]){ return; }
      counter++;
      order[val]=counter;
      badge.textContent = counter;
      item.classList.add('ranked');
    };
    list.appendChild(item);
  });
  card.appendChild(list);
  const resetBtn = el('button',{class:'btn btn-ghost'}, 'Reiniciar orden');

function renderGridScale(q, onNext, prev){
  const card = questionShell(q.code, q.varTag, q.title, q.subtitle);
  const min = q.min ?? 0, max = q.max ?? 10;
  const answers = prev && prev.value ? {...prev.value} : {};
  q.items.forEach(([val,label]) => {
    const gi = el('div',{class:'grid-item'});
    gi.appendChild(el('div',{class:'grid-item-label'}, label));
    const row = buildScaleRow(min, max);
    for(let i=min;i<=max;i++){
      const b = el('button',{class:'scale-btn'}, String(i));
      if(answers[val] === i) b.classList.add('selected');
      b.onclick = () => {
        [...row.children].forEach(c=>c.classList.remove('selected'));
        b.classList.add('selected');
        answers[val]=i;
      };
      row.appendChild(b);
    }
    gi.appendChild(row);
    if(q.minLabel || q.maxLabel){
      gi.appendChild(el('div',{class:'scale-labels'},
        el('span',{}, `${min} = ${q.minLabel||''}`),
        el('span',{}, `${max} = ${q.maxLabel||''}`)));
    }
    card.appendChild(gi);
  });
  const nextBtn = el('button',{class:'btn btn-primary'}, 'Següent');
  nextBtn.onclick = () => onNext({value: {...answers}});
  card.appendChild(navRow(nextBtn));
  return card;
}

function renderConjointTask(q, onNext, prev){
  const card = questionShell(q.code, q.varTag, q.title, `Tarea ${q.taskNum} de ${q.taskTotal}`);
  if(q.singleText){
    const boxA = el('div',{class:'scenario'});
    boxA.innerHTML = `<b style="color:var(--accent-dark); font-size:12px; text-transform:uppercase; letter-spacing:.06em;">${q.optionALabel||'Medida A'}</b><br>` + mdToHtml(q.textA);
    const boxB = el('div',{class:'scenario', style:'margin-top:10px;'});
    boxB.innerHTML = `<b style="color:var(--accent-dark); font-size:12px; text-transform:uppercase; letter-spacing:.06em;">${q.optionBLabel||'Medida B'}</b><br>` + mdToHtml(q.textB);
    card.appendChild(boxA);
    card.appendChild(boxB);
  } else {
    const table = el('table',{class:'conjoint-table'});
    const thead = el('tr',{}, el('th',{},'Atributo'), el('th',{},'Medida A'), el('th',{},'Medida B'));
    table.appendChild(thead);
    q.rows.forEach(r => {
      table.appendChild(el('tr',{}, el('td',{class:'attr-label'}, r.label), el('td',{}, r.a), el('td',{}, r.b)));
    });
    card.appendChild(table);
  }

  const pv = (prev && prev.value) || {};
  let choice = pv.choice ?? null, rateA = pv.rateA ?? null, rateB = pv.rateB ?? null;
  const opts = el('div',{class:'options'});
  [['A', q.optionALabel||'Medida A'], ['B', q.optionBLabel||'Medida B']].forEach(([val,label]) => {
    const b = el('button',{class:'opt'}, label);
    if(choice === val) b.classList.add('selected');
    b.onclick = () => { [...opts.children].forEach(c=>c.classList.remove('selected')); b.classList.add('selected'); choice = val; };
    opts.appendChild(b);
  });
  card.appendChild(el('div',{class:'grid-item-label'},'¿Cuál preferirías?'));
  card.appendChild(opts);

  const rateBlockA = el('div',{class:'rate-block'});
  rateBlockA.appendChild(el('div',{class:'rate-label'}, `Valoración ${q.optionALabel||'Medida A'} (0 = totalmente en contra, 10 = totalmente a favor)`));
  const rowA = el('div',{class:'mini-scale'});
  rowA.style.display='grid'; rowA.style.gridTemplateColumns='repeat(6, 1fr)'; rowA.style.rowGap='4px';
  for(let i=0;i<=10;i++){ const b=el('button',{class:'mini-btn'},String(i)); if(rateA===i) b.classList.add('selected'); b.onclick=()=>{[...rowA.children].forEach(c=>c.classList.remove('selected')); b.classList.add('selected'); rateA=i;}; rowA.appendChild(b);}
  rateBlockA.appendChild(rowA);
  const rateBlockB = el('div',{class:'rate-block', style:'margin-top:16px;'});
  rateBlockB.appendChild(el('div',{class:'rate-label'}, `Valoración ${q.optionBLabel||'Medida B'}`));
  const rowB = el('div',{class:'mini-scale'});
  rowB.style.display='grid'; rowB.style.gridTemplateColumns='repeat(6, 1fr)'; rowB.style.rowGap='4px';
  for(let i=0;i<=10;i++){ const b=el('button',{class:'mini-btn'},String(i)); if(rateB===i) b.classList.add('selected'); b.onclick=()=>{[...rowB.children].forEach(c=>c.classList.remove('selected')); b.classList.add('selected'); rateB=i;}; rowB.appendChild(b);}
  rateBlockB.appendChild(rowB);
  card.appendChild(rateBlockA);
  card.appendChild(rateBlockB);

  const nextBtn = el('button',{class:'btn btn-primary'}, 'Següent');
  nextBtn.onclick = () => onNext({value:{choice, rateA, rateB}});
  card.appendChild(navRow(nextBtn));
  return card;
}

      <h3>Experimento 3: Sistemas electorales</h3>
      <p>Finalmente, has evaluado diferentes diseños sobre sistemas electorales. En este caso, los atributos
      que se han mostrado se han atribuido de forma aleatoria entre los participantes. El objetivo de este
      experimento es comprender mejor cómo piensan los ciudadanos sobre los sistemas electorales y si las
      preferencias varían según cómo se presenta la información.</p>

      <h3>Tus derechos</h3>
      <p>Tu participación en este estudio sigue siendo totalmente voluntaria.</p>
      <p>Si, tras conocer el objetivo completo del estudio, ya no deseas que tus respuestas se incluyan en
      la investigación, puedes solicitar la retirada de tus datos contactando con el equipo de investigación
      a través de la información de contacto facilitada en la hoja informativa para participantes. Para
      poder localizar tus respuestas necesitaremos el código de panel con el que participaste. Una vez el
      conjunto de datos se haya anonimizado de forma definitiva para su publicación, ya no será posible
      identificar ni retirar respuestas individuales.</p>
      <p>Los datos recogidos en esta encuesta se utilizarán únicamente con fines de investigación
      científica. Se tratan de forma confidencial y de acuerdo con el Reglamento General de Protección de
      Datos (RGPD) y con las políticas institucionales aplicables. El equipo investigador no dispone de
      información que permita identificarte: los resultados se analizan y se publican siempre de forma
      agregada, y el fichero que se deposite en acceso abierto estará completamente anonimizado. En ningún
      caso se utilizarán con fines comerciales ni se cederán a terceros ajenos a la investigación.</p>

      <h3>Gracias</h3>
      <p>Gracias de nuevo por tu valiosa participación. Tu contribución ayuda a los investigadores a
      comprender mejor cómo evalúan los ciudadanos las políticas públicas, las instituciones democráticas y
      las iniciativas medioambientales, contribuyendo en última instancia a la elaboración de políticas
      basadas en la evidencia y al conocimiento científico.</p>
      <p>Si quieres más información del proyecto visita la web <a href="http://attclimate.net"
      target="_blank" rel="noopener">attclimate.net</a> o contacta con el investigador principal,
      Marc Guinjoan (marc.guinjoanc@uab.cat).</p>

      <p class="note">Nota del simulador: aquest és el text del debriefing tal com està avui. Encara parla
      de tres experiments i el qüestionari ja en té més, o sigui que s'ha d'actualitzar abans del camp.
      El bloc del cartell que veus a dalt és el que et tocaria pel grup que t'ha assignat l'atzar en
      l'Experiment B.</p>`});

  const ack = cB === 1
    ? 'He leído la información anterior sobre los objetivos de esta encuesta y entiendo que mis respuestas se utilizarán únicamente con fines de investigación científica.'
    : cB === 2
      ? 'He leído la información anterior. Entiendo que el cartel que se me mostró fue elaborado por el equipo de investigación con fines de investigación, que la información que contenía se basa en evidencia científica publicada, y que mis respuestas se utilizarán únicamente con fines de investigación científica.'
      : 'Entiendo que la versión del estudio que vi incluía un logotipo gubernamental únicamente con fines de investigación. Reconozco que el cartel fue creado por el equipo de investigación y que no era una comunicación oficial del Gobierno de España. Asimismo, entiendo que la información presentada en el cartel se basaba en evidencia científica real, que la atribución de la fuente se modificó temporalmente con fines experimentales, y que mis respuestas se utilizarán únicamente con fines de investigación científica.';

  push({block:'DEBRIEF', code:'DEBRIEF_ACK', varTag:'[debrief_ack]', type:'single',
    title:'Confirmación activa',
    subtitle:'Para asegurarnos de que has leído y comprendido la información anterior, marca la casilla siguiente antes de finalizar tu participación.',
    options:[['1', ack]]});

  return F;
}

/* ============ ENGINE ============ */
let FLOW = [];
let idx = 0;

function updateTopbar(){
  const done = Object.keys(S.answers).length;
  const pct = Math.min(100, Math.round((idx/FLOW.length)*100));
  $('#progressFill').style.width = pct+'%';
  const cur = FLOW[idx];
  $('#blockLabel').textContent = cur ? blockName(cur.block) : '';
}
function blockName(b){
  const names = {CONSENT:'Consentiment informat', DEBRIEF:'Debriefing',
    A:'Bloc A · Identificació', B:'Bloc B · Actituds climàtiques', C:'Bloc C · Ideologia i confiança',
    D:'Bloc D · Suport a polítiques', 'EXP-A':'Experiment A · Fiscalitat', 'EXP-B':'Experiment B · Nudge',
    'EXP-C':'Experiment C · Conjoint polítiques', E:'Bloc E · Comportament electoral', 'EXP-D':'Experiment D · Sistemes electorals',
    'EXP-E':'Experiment E · Assegurança', F:'Bloc F · Dades de la llar'};
  return names[b] || b;
}

function resumeClock(){
  if(S.clockTimer) clearInterval(S.clockTimer);
  S.clockTimer = setInterval(()=>{
    $('#clock').textContent = fmtTime((Date.now()-S.startTs)/1000);
  },500);
}
function startClock(){
  S.startTs = Date.now();
  resumeClock();
}

/* El temps s'acumula per posició del flux, de manera que tornar enrere
   i tornar a passar per una pantalla suma en comptes de duplicar files. */
function recordTiming(i, q, elapsed){
  if(!S.timings[i]) S.timings[i] = {code:q.code, block:q.block, seconds:0};
  S.timings[i].seconds += elapsed;
}

function goBack(){
  if(idx < FLOW.length && S.qStartTs){
    recordTiming(idx, FLOW[idx], (Date.now()-S.qStartTs)/1000);
  }
  let j = Math.min(idx, FLOW.length) - 1;
  while(j > 0 && FLOW[j].skipIf && FLOW[j].skipIf(S.answers)) j--;
  idx = Math.max(0, j);
  resumeClock();
  renderCurrent();
}

function renderCurrent(){
  const app = $('#app');
  app.innerHTML = '';
  if(idx >= FLOW.length){ renderEnd(); return; }
  const q = FLOW[idx];
  if(q.skipIf && q.skipIf(S.answers)){ idx++; renderCurrent(); return; }
  S.qStartTs = Date.now();
  updateTopbar();
  const here = idx;
  const onNext = (result) => {
    recordTiming(here, q, (Date.now()-S.qStartTs)/1000);
    if(q.code) S.answers[q.code] = result;
    idx = here + 1;
    renderCurrent();
  };
  const prev = q.code ? S.answers[q.code] : undefined;
  let node;
  switch(q.type){
    case 'info': node = renderInfo(q, onNext); break;
    case 'doc': node = renderDoc(q, onNext, prev); break;
    case 'single': node = renderSingle(q, onNext, prev); break;
    case 'scale': node = renderScale(q, onNext, prev); break;
    case 'number': node = renderNumber(q, onNext, prev); break;
    case 'rank': node = renderRank(q, onNext, prev); break;
    case 'grid_scale': node = renderGridScale(q, onNext, prev); break;
    case 'grid_binary': node = renderGridBinary(q, onNext, prev); break;
    case 'conjoint': node = renderConjointTask(q, onNext, prev); break;
    default: node = el('div',{},'?');
  }
  app.appendChild(node);
  window.scrollTo({top:0,behavior:'instant'});
}

function renderEnd(){
  clearInterval(S.clockTimer);
  const totalSec = (Date.now()-S.startTs)/1000;
  const timings = S.timings.filter(Boolean);
  const app = $('#app');
  app.innerHTML='';
  const card = el('div',{class:'card end-screen'});
  card.appendChild(el('h1',{},'Enquesta completada'));
  card.appendChild(el('p',{class:'qsubtitle'}, `Has passat per ${timings.length} de ${FLOW.length} pantalles.`));

  const backRow = el('div',{class:'btn-row', style:'justify-content:flex-start; margin-bottom:18px;'});
  const backEnd = el('button',{class:'btn btn-ghost'}, '← Tornar a l\'última pantalla');
  backEnd.onclick = () => goBack();
  backRow.appendChild(backEnd);
  card.appendChild(backRow);

  const totalRow = el('div',{class:'stat-row'}, el('span',{},'Temps total'), el('b',{}, fmtTime(totalSec)));
  card.appendChild(totalRow);

  // per block breakdown
  const byBlock = {};
  timings.forEach(t=>{ byBlock[t.block] = (byBlock[t.block]||0) + t.seconds; });
  Object.keys(byBlock).forEach(b=>{
    card.appendChild(el('div',{class:'stat-row'}, el('span',{}, blockName(b)), el('b',{}, fmtTime(byBlock[b]))));
  });

  const table = el('table',{class:'timing'});
  table.appendChild(el('tr',{}, el('th',{},'Pantalla'), el('th',{},'Bloc'), el('th',{},'Segons')));
  timings.forEach(t=>{
    table.appendChild(el('tr',{}, el('td',{},t.code||'—'), el('td',{},blockName(t.block)), el('td',{},t.seconds.toFixed(1))));
  });
  card.appendChild(el('div',{class:'grid-item-label', style:'margin-top:22px;'},'Detall per pantalla'));
  card.appendChild(table);

  const saveRow = el('div',{style:'margin-top:20px; padding:16px 18px; background:var(--paper2); border-radius:2px;'});
  const saveStatus = el('div',{class:'hint', style:'margin-bottom:10px;'},
    APPS_SCRIPT_URL ? 'Les respostes es poden guardar al full de Google compartit.' : 'Enviament desactivat: encara no s\'ha configurat la URL de l\'Apps Script (APPS_SCRIPT_URL).');
  const saveBtn = el('button',{class:'btn btn-primary'}, 'Guardar respostes al full de Google');
  saveBtn.disabled = !APPS_SCRIPT_URL;
  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Enviant…';
    try{
      await fetch(APPS_SCRIPT_URL, {
        method:'POST',
        mode:'no-cors',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({
          timestampClient: new Date().toISOString(),
          totalSeconds: totalSec,
          assign: S.assign,
          answers: S.answers,
          timings: timings
        })
      });
      saveStatus.textContent = 'Respostes enviades. (Amb mode "no-cors" el navegador no confirma la resposta del servidor; comprova el full de Google per verificar-ho.)';
      saveBtn.textContent = 'Enviat ✓';
    } catch(err){
      saveStatus.textContent = 'Hi ha hagut un error enviant les dades: ' + err.message;
      saveBtn.disabled = false;
      saveBtn.textContent = 'Torna-ho a provar';
    }
  };
  saveRow.appendChild(saveStatus);
  saveRow.appendChild(saveBtn);
  card.appendChild(saveRow);

  const btnRow = el('div',{class:'btn-row', style:'margin-top:24px;'});
  const restart = el('button',{class:'btn btn-primary'}, 'Tornar a fer-la (nova aleatorització)');
  restart.onclick = () => init();
  btnRow.appendChild(restart);
  card.appendChild(btnRow);

  app.appendChild(card);
  $('#topbar').style.display = 'none';
}

function renderStart(){
  const app = $('#app');
  app.innerHTML='';
  const s = el('div',{class:'start-screen'});
  s.appendChild(el('h1',{},'ATTCLIMPOLS · Ola 5'));
  s.appendChild(el('p',{},'Simulador de pràctica del qüestionari (v.7, 3 d\'agost de 2026). Recorreràs els blocs A–F i els cinc experiments amb la mateixa lògica de branques i aleatorització que el disseny real.'));
  const meta = el('div',{class:'meta-list'});
  meta.appendChild(el('div',{},el('b',{},'A5 i A6'),' s\'ometen: s\'autocompleten amb dades de panell i no es mostren a l\'enquestat.'));
  meta.appendChild(el('div',{},el('b',{},'Experiment A'),' — condició assignada a l\'atzar (1 de 5).'));
  meta.appendChild(el('div',{},el('b',{},'Experiment B'),' — condició assignada a l\'atzar (1 de 3); el cartell es mostra com a text descriptiu (sense imatge).'));
  meta.appendChild(el('div',{},el('b',{},'Experiment C'),' — 4 tasques de conjoint amb perfils generats a l\'atzar.'));
  meta.appendChild(el('div',{},el('b',{},'Experiment D'),' — grup assignat a l\'atzar (A/B/C/D), amb l\'ordre de conjoints corresponent.'));
  meta.appendChild(el('div',{},el('b',{},'Experiment E'),' — només si el grup assignat és C o D.'));
  meta.appendChild(el('div',{},'El cronòmetre es posa en marxa en clicar «Començar» i queda registrat el temps per pantalla i per bloc.'));
  s.appendChild(meta);
  const btn = el('button',{class:'btn btn-primary'}, 'Començar');
  btn.style.padding = '14px 40px';
  btn.style.fontSize = '16px';
  btn.onclick = () => { init(true); };
  s.appendChild(btn);
  app.appendChild(s);
}

function init(started){
  S.answers = {}; S.assign = {}; S.timings = []; idx = 0;
  clearInterval(S.clockTimer);
  if(!started){ $('#topbar').style.display='none'; renderStart(); return; }
  FLOW = buildFlow();
  $('#topbar').style.display='block';
  startClock();
  renderCurrent();
}

init(false);
</script>
